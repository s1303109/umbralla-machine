<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1890" viewBox="0 0 1800 1890"><title>24V JGB37-555 馬達無降壓器參考圖</title><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="1800" height="1890" fill="#f8fafc"/><text x="60" y="48" font-size="29" font-weight="700" fill="#102a43">24V 減速馬達參考接線｜無降壓器、無伺服訊號；GPIO2 控制 K2</text>
<text x="60" y="82" font-size="18" font-weight="400" fill="#be123c">依商品表：JGB37-555-2460，空載 7rpm／0.14A，額定負載 5.5rpm／0.65A，堵轉 3A；非實測。</text>
<rect x="40" y="110" width="1720" height="570" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="65" y="150" font-size="26" font-weight="700" fill="#102a43">C. 馬達電源：24V 直接經 K2 COM／NO，供給兩線式直流馬達</text>
<text x="65" y="184" font-size="19" font-weight="700" fill="#be123c">D-50B 的 24V 僅額定 1A：尚未證實可可靠啟動此馬達；本圖說明接線關係，不表示容量已足夠。</text>
<rect x="75" y="230" width="310" height="240" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="95" y="268" font-size="21" font-weight="700" fill="#102a43">PS1：D-50B 直流輸出</text>
<text x="95" y="307" font-size="20" font-weight="700" fill="#be123c">4：+24V（額定 1A）</text>
<text x="95" y="350" font-size="19" font-weight="400" fill="#102a43">7：+5V（額定 6A）</text>
<text x="95" y="385" font-size="18" font-weight="400" fill="#102a43">5V 供電支路見 B、D 區</text>
<text x="95" y="427" font-size="20" font-weight="700" fill="#102a43">5／6：COM（0V）</text>
<rect x="620" y="230" width="350" height="240" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="640" y="268" font-size="21" font-weight="700" fill="#102a43">K2：馬達電源接點側</text>
<text x="640" y="340" font-size="19" font-weight="700" fill="#102a43">COM</text>
<text x="880" y="340" font-size="19" font-weight="700" fill="#102a43">NO</text>
<path d="M385 300 H700" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<path d="M700 300 L820 275" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<circle cx="850" cy="300" r="6" fill="white" stroke="#111827" stroke-width="2"/>
<path d="M856 300 H1410" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<text x="640" y="380" font-size="18" font-weight="400" fill="#102a43">NC 留空；馬達電流經接點</text>
<text x="640" y="415" font-size="18" font-weight="700" fill="#be123c">K2 的 VCC 仍然使用 5V</text>
<text x="640" y="448" font-size="18" font-weight="400" fill="#102a43">直流馬達接點能力待核對</text>
<rect x="1410" y="230" width="320" height="240" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="1430" y="268" font-size="20" font-weight="700" fill="#102a43">M2：JGB37-555-2460</text>
<text x="1430" y="307" font-size="20" font-weight="700" fill="#102a43">＋ ← K2 NO</text>
<text x="1430" y="350" font-size="20" font-weight="700" fill="#102a43">DC 24V／空載 7rpm</text>
<text x="1430" y="385" font-size="18" font-weight="400" fill="#102a43">兩線式；單方向啟停</text>
<text x="1430" y="427" font-size="20" font-weight="700" fill="#102a43">－ → PS1 COM</text>
<path d="M385 420 H450 V520 H1360 V420 H1410" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
<path d="M450 520 V605 H515" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<circle cx="450" cy="520" r="6" fill="#111827"/>
<text x="530" y="613" font-size="19" font-weight="700" fill="#102a43">G：COM → ESP32 GND／Q2 E／模組低壓 GND</text>
<path d="M1240 300 V355" fill="none" stroke="#be123c" stroke-width="4" stroke-linejoin="round"/>
<path d="M1222 355 H1258" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<path d="M1240 363 L1222 397 H1258 Z" fill="white" stroke="#111827" stroke-width="3"/>
<path d="M1240 397 V520" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<circle cx="1240" cy="300" r="6" fill="#111827"/>
<circle cx="1240" cy="520" r="6" fill="#111827"/>
<text x="1000" y="555" font-size="19" font-weight="700" fill="#102a43">D1：1N5408；跨馬達兩端</text>
<text x="1000" y="582" font-size="17" font-weight="400" fill="#102a43">有環 K → 馬達＋；無環 A → 馬達－</text>
<text x="75" y="555" font-size="19" font-weight="700" fill="#102a43">馬達負極用獨立線回 COM。</text>
<text x="75" y="582" font-size="18" font-weight="400" fill="#be123c">馬達電流不經 ESP32 GND 細線。</text>
<text x="75" y="655" font-size="18" font-weight="700" fill="#102a43">G＝直流 COM；FG＝保護地 PE。此圖沒有 COM–FG 短接；保護元件符號省略不表示可拆除實物。</text>
<g xmlns="http://www.w3.org/2000/svg"><rect x="40" y="710" width="1720" height="680" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
<text x="65" y="750" font-size="26" font-weight="700" fill="#102a43">D. 5V 控制介面：GPIO2 → Q2 → K2 IN；Q2 不承受馬達電流</text>
<text x="65" y="785" font-size="19" font-weight="400" fill="#102a43">K2 低電位觸發、VCC 使用 5V；馬達的 24V 只接 K2 COM／NO。Q2 與 R1／R2／R3 沿用。</text>
<text x="85" y="851" font-size="18" font-weight="700" fill="#be123c">PS1:7 +5V 直接分支</text>
<path d="M75 900 H350" fill="none" stroke="#c27100" stroke-width="4" stroke-linejoin="round" />
<rect x="350" y="820" width="350" height="240" rx="12" fill="#fff" stroke="#486581" stroke-width="2" />
<text x="375" y="858" font-size="21" font-weight="700" fill="#102a43">D-50B：電晶體 5V 分支</text>
<text x="375" y="907" font-size="18" font-weight="700" fill="#102a43">+5V</text>
<text x="615" y="907" font-size="18" font-weight="700" fill="#102a43">+5V</text>
<text x="375" y="956" font-size="18" font-weight="400" fill="#be123c">此分支只接 R3 上端</text>
<text x="375" y="1007" font-size="18" font-weight="700" fill="#102a43">0V</text>
<text x="615" y="1007" font-size="18" font-weight="700" fill="#102a43">0V</text>
<text x="375" y="1042" font-size="16" font-weight="400" fill="#102a43">K2 VCC 由 ESP32 的 5V 接點分接</text>
<path d="M700 900 H1160" fill="none" stroke="#c27100" stroke-width="5" stroke-linejoin="round" />
<text x="770" y="879" font-size="17" font-weight="700" fill="#c27100">+5V → R3；不能上拉到 24V</text>
<path d="M350 1000 H270 V1320" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
<path d="M700 1000 H730" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
<text x="738" y="1007" font-size="16" font-weight="400" fill="#102a43">G（接共地排）</text>
<rect x="1320" y="820" width="390" height="280" rx="12" fill="#fff" stroke="#486581" stroke-width="2" />
<text x="1345" y="858" font-size="21" font-weight="700" fill="#102a43">K2 模組控制側：5V 供電</text>
<text x="1345" y="907" font-size="19" font-weight="700" fill="#102a43">VCC ← ESP32 5V 分接</text>
<text x="1345" y="946" font-size="20" font-weight="700" fill="#be123c">低電位觸發；無可見 H/L 跳帽</text>
<text x="1345" y="1007" font-size="19" font-weight="700" fill="#102a43">IN ← Q2 集電極 C</text>
<text x="1345" y="1067" font-size="19" font-weight="700" fill="#102a43">GND ← G（0V）</text>
<path d="M1320 1060 H1290 V1320" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
<rect x="75" y="1100" width="325" height="170" rx="12" fill="#fff" stroke="#486581" stroke-width="2" />
<text x="100" y="1138" font-size="22" font-weight="700" fill="#102a43">ESP32：GPIO2</text>
<text x="100" y="1173" font-size="18" font-weight="400" fill="#102a43">HIGH 啟動／LOW 關閉</text>
<text x="100" y="1208" font-size="18" font-weight="400" fill="#102a43">LCD 與感測器線全部保留</text>
<text x="100" y="1243" font-size="18" font-weight="400" fill="#102a43">GND → G 共地端子排</text>
<path d="M400 1160 H600" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round" />
<text x="85" y="962" font-size="17" font-weight="700" fill="#7c3aed">原 GPIO7 → K1 IN</text>
<text x="85" y="991" font-size="17" font-weight="400" fill="#7c3aed">保持原 H 觸發接線</text>
<rect x="600" y="1145" width="120" height="30" rx="2" fill="#fff" stroke="#7c3aed" stroke-width="2" />
<text x="592" y="1126" font-size="18" font-weight="700" fill="#102a43">R1：1.5kΩ</text>
<text x="592" y="1102" font-size="16" font-weight="400" fill="#102a43">0.25W／±5%</text>
<path d="M720 1160 H955" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round" />
<circle cx="820" cy="1160" r="6" fill="#7c3aed" />
<path d="M820 1160 V1210" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round" />
<rect x="809" y="1210" width="22" height="55" rx="2" fill="#fff" stroke="#486581" stroke-width="2" />
<path d="M820 1265 V1320" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round" />
<text x="575" y="1233" font-size="18" font-weight="400" fill="#102a43">R2：47kΩ</text>
<text x="575" y="1260" font-size="16" font-weight="400" fill="#102a43">0.25W／±5%</text>
<circle cx="990" cy="1160" r="64" fill="none" stroke="#486581" stroke-width="2" />
<path d="M955 1123 V1198" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
<path d="M955 1141 L1015 1100 V1000 H1320" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
<path d="M955 1180 L1015 1220 V1320" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
<path d="M993 1194 L1010 1216 L984 1209 Z" fill="#111827" />
<text x="916" y="1141" font-size="18" font-weight="700" fill="#102a43">B</text>
<text x="1035" y="1090" font-size="18" font-weight="700" fill="#102a43">C</text>
<text x="1035" y="1250" font-size="18" font-weight="700" fill="#102a43">E</text>
<text x="1050" y="1230" font-size="17" font-weight="700" fill="#102a43">Q2：S9014（C331）</text>
<text x="1050" y="1262" font-size="17" font-weight="700" fill="#102a43">或 2N3904；NPN</text>
<circle cx="1160" cy="900" r="6" fill="#c27100" />
<path d="M1160 900 V930" fill="none" stroke="#c27100" stroke-width="3" stroke-linejoin="round" />
<rect x="1149" y="930" width="22" height="40" rx="2" fill="#fff" stroke="#486581" stroke-width="2" />
<path d="M1160 970 V1000" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round" />
<circle cx="1160" cy="1000" r="6" fill="#111827" />
<circle cx="1015" cy="1000" r="6" fill="#111827" />
<text x="1183" y="957" font-size="17" font-weight="400" fill="#102a43">R3：4.7kΩ</text>
<text x="1183" y="983" font-size="15" font-weight="400" fill="#102a43">¼W ±5%</text>
<path d="M400 1250 H430 V1320" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round" />
<path d="M75 1320 H1550" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round" />
<circle cx="270" cy="1320" r="6" fill="#111827" />
<circle cx="430" cy="1320" r="6" fill="#111827" />
<circle cx="820" cy="1320" r="6" fill="#111827" />
<circle cx="1015" cy="1320" r="6" fill="#111827" />
<circle cx="1290" cy="1320" r="6" fill="#111827" />
<text x="85" y="1347" font-size="17" font-weight="700" fill="#102a43">G：PS1 COM、ESP32 GND、Q2 E 共地；K2／LCD／HC 的 GND 由 ESP32 接點分接。</text>
<text x="85" y="1377" font-size="18" font-weight="700" fill="#102a43">共同判斷：GPIO7 → K1；GPIO2 → Q2 → K2。啟動時兩路 HIGH，停止時兩路 LOW（須先驗證）。</text>
<text x="60" y="1424" font-size="19" font-weight="400" fill="#be123c">介面驗證目標：IN ≤0.3V 且吸合、IN ≥4.5V 且釋放；Q2 集電極總電流 ≤10mA，須實測。</text>
<text x="60" y="1458" font-size="18" font-weight="400" fill="#102a43">同名端點相接；交叉有圓點才相接。電源啟動容量、線徑、保護、D1 與 K2 馬達接點能力仍待確認。</text>
</g>
<path d="M120 1100 V1070 H55 V815 H1260 V900 H1320" fill="none" stroke="#c27100" stroke-width="4" stroke-linejoin="round"/>
<circle cx="120" cy="1100" r="5" fill="#c27100"/>
<text x="140" y="1090" font-size="16" font-weight="700" fill="#c27100">5V 分接</text>
<text x="1060" y="850" font-size="17" font-weight="700" fill="#c27100">ESP32 5V 分接</text>
<rect x="40" y="1495" width="1720" height="360" rx="12" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="65" y="1535" font-size="26" font-weight="700" fill="#102a43">E. 接地與規劃狀態</text>
<text x="75" y="1580" font-size="22" font-weight="700" fill="#102a43">PS1 COM（5／6）→ ESP32 GND；PS1 FG（3）→ PE 保護地。市電 N 不接低壓 G。</text>
<text x="75" y="1625" font-size="21" font-weight="400" fill="#102a43">移除伺服、其 SIG 線與專用 10kΩ 下拉；GPIO1 留空。GPIO4 仍是 LCD RESET。</text>
<text x="75" y="1670" font-size="20" font-weight="400" fill="#102a43">D1 為續流候選，依 3A 斷電電流、啟停頻率與溫升再核對；不能單靠「3A」標示定案。</text>
<text x="75" y="1715" font-size="20" font-weight="400" fill="#102a43">24V 電源需有足夠啟動能力；若改用另一台電源，其端子與共地方式須依新型號確認。</text>
<text x="75" y="1760" font-size="20" font-weight="700" fill="#be123c">本次只新增參考圖：原 main/main.c 仍含伺服測試流程，未改程式、未燒錄、未實機驗證。</text>
<text x="75" y="1810" font-size="18" font-weight="400" fill="#102a43">原市電區沿用原圖作辨識參考；線色代表網路功能，不代表現場電纜。保護額定仍須依實物核對。</text></svg>