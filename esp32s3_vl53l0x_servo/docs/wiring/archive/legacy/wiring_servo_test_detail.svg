<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2260" viewBox="0 0 1800 2260"><title>伺服辨識測試接線圖</title><desc>保留GPIO7原繼電器與GPIO2的K2電源控制，新增GPIO1伺服訊號。LM2596暫按6V規劃但實物額定及供電容量待確認。移除原馬達續流二極體，新增SIG至GND的10k下拉。50Hz，1500微秒後1600微秒，非40rpm校正。</desc><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="1800" height="2260" fill="#f8fafc"/><text x="60" y="48" font-size="29" font-weight="700" fill="#102a43">伺服辨識測試接線｜GPIO1 訊號、GPIO2 控制 K2 電源、GPIO7 保留</text>
<text x="60" y="82" font-size="18" font-weight="400" fill="#be123c">SV1 型號／連續旋轉能力未確認；6V 及 3.3V 訊號相容性、供電容量需依實物核對。非 40rpm 校正版。</text>
<rect x="40" y="110" width="1720" height="570" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="65" y="150" font-size="26" font-weight="700" fill="#102a43">C. 將原減速馬達換成三線伺服；K2 保留作電源開關</text>
<text x="65" y="184" font-size="19" font-weight="700" fill="#be123c">先拆除負載測試；U1 空載量測並調為 6.0V，僅在伺服規格允許 6V 時使用。</text>
<rect x="75" y="220" width="230" height="250" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="95" y="258" font-size="21" font-weight="700" fill="#102a43">PS2：既有 24V</text>
<text x="95" y="307" font-size="22" font-weight="700" fill="#102a43">+24V 輸出</text>
<text x="95" y="350" font-size="18" font-weight="400" fill="#be123c">額定電流待核對</text>
<text x="95" y="383" font-size="18" font-weight="400" fill="#102a43">原 5V 輸出保留</text>
<text x="95" y="427" font-size="22" font-weight="700" fill="#102a43">0V／負極</text>
<rect x="340" y="280" width="130" height="40" rx="4" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="354" y="307" font-size="18" font-weight="700" fill="#102a43">F3 待定</text>
<text x="332" y="265" font-size="16" font-weight="400" fill="#102a43">24V 輸入保護</text>
<text x="332" y="352" font-size="16" font-weight="400" fill="#102a43">DC ≥32V</text>
