<text x="435" y="608" font-size="18" font-weight="700" fill="#102a43">0V → D 區 G 共地端子排</text>
<text x="75" y="560" font-size="18" font-weight="700" fill="#be123c">伺服正負極不可反接；方向由訊號決定。</text>
<text x="890" y="560" font-size="19" font-weight="700" fill="#be123c">原馬達端 D1：移除，不跨接到伺服 V＋／GND。</text>
<text x="890" y="590" font-size="17" font-weight="400" fill="#102a43">伺服電流直接回 U1 OUT−，不經 ESP32 GND 細線。</text>
<text x="890" y="620" font-size="17" font-weight="400" fill="#102a43">3A 等級伺服不可直接假定此 LM2596 模組供得動。</text>
<text x="75" y="655" font-size="19" font-weight="700" fill="#102a43">端子依實物標示辨識，不按線色或圖上左右猜測；5V、6V、24V 正極分開。</text>
<rect x="40" y="710" width="1720" height="680" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="750" font-size="26" font-weight="700" fill="#102a43">D. 新增 5V 繼電器供電與訊號介面（HW-307／JQC3F-05VDC-C）</text>
<text x="65" y="785" font-size="19" font-weight="400" fill="#102a43">原 K1：GPIO7／H 觸發；新 K2：GPIO2 經 Q2 拉低 IN 啟動。模組供電 5V；伺服 V＋由 U1 經 K2 供電。</text>
<text x="85" y="851" font-size="18" font-weight="700" fill="#be123c">來自 B 區 +5V BUS</text>
<rect x="90" y="883" width="130" height="34" rx="3" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="104" y="907" font-size="18" font-weight="700" fill="#102a43">F4：待定</text>
