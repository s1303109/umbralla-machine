<circle cx="1290" cy="1320" r="6" fill="#111827"/>
<text x="85" y="1347" font-size="17" font-weight="700" fill="#102a43">G：24V 負極、U1 IN−／OUT−、5V 負極、ESP32 GND、Q2 E、K2 GND 共地（確認輸出可共地）</text>
<text x="85" y="1377" font-size="18" font-weight="700" fill="#102a43">共同判斷：GPIO7 → K1；GPIO2 → Q2 → K2。啟動時兩路 HIGH，停止時兩路 LOW（須先驗證）。</text>
<text x="60" y="1424" font-size="19" font-weight="400" fill="#be123c">介面驗證目標：IN ≤0.3V 且吸合、IN ≥4.5V 且釋放；Q2 集電極總電流 ≤10mA，須實測。</text>
<text x="60" y="1458" font-size="18" font-weight="400" fill="#102a43">同名端點視為相接；交叉處有圓點才相接。保險絲、線徑及 K2 接點對伺服電源的適用性尚待核對，這不是已驗收施工圖。</text>

<rect x="40" y="1495" width="1720" height="280" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
<text x="65" y="1535" font-size="25" font-weight="700" fill="#102a43">E. 新增一根伺服控制線：GPIO1 → SV1 SIG（不經 Q2、不接 K2 IN）</text>
<rect x="75" y="1560" width="400" height="150" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="100" y="1607" font-size="23" font-weight="700" fill="#7c3aed">ESP32-S3：GPIO1</text>
<text x="100" y="1645" font-size="19" font-weight="400" fill="#102a43">3.3V 邏輯，50Hz RC 伺服脈波</text>
<text x="100" y="1683" font-size="19" font-weight="400" fill="#102a43">GND → 共地排 G</text>
<rect x="1200" y="1560" width="500" height="150" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="1225" y="1607" font-size="23" font-weight="700" fill="#7c3aed">SV1：SIG 控制輸入</text>
<text x="1225" y="1645" font-size="20" font-weight="700" fill="#be123c">須確認支援 3.3V 訊號</text>
<text x="1225" y="1683" font-size="18" font-weight="400" fill="#102a43">不支援時須另設介面，不能直接</text>
<path d="M475 1600 H1200" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
<circle cx="850" cy="1600" r="6" fill="#7c3aed"/>
<path d="M850 1600 V1640" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/>
<rect x="839" y="1640" width="22" height="45" rx="2" fill="#fff" stroke="#486581" stroke-width="2"/>
<path d="M850 1685 V1730" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<path d="M475 1730 H1600" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<circle cx="850" cy="1730" r="6" fill="#111827"/>
<text x="1620" y="1737" font-size="19" font-weight="700" fill="#102a43">G</text>
<text x="890" y="1660" font-size="18" font-weight="700" fill="#102a43">R4：10kΩ</text>
<text x="890" y="1690" font-size="16" font-weight="400" fill="#102a43">¼W／±5%，SIG → G</text>
<text x="75" y="1755" font-size="18" font-weight="700" fill="#102a43">R4 為開機訊號下拉；K2 斷電時 GPIO1 維持 LOW。GPIO4 是 LCD RESET，禁止改接伺服。</text>
<rect x="40" y="1800" width="1720" height="420" rx="12" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="65" y="1840" font-size="25" font-weight="700" fill="#102a43">F. 本次測試流程與元件（非 40rpm 校正版；不掃描機械端點）</text>
<rect x="75" y="1865" width="800" height="300" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<rect x="900" y="1865" width="820" height="300" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="100" y="1900" font-size="22" font-weight="700" fill="#102a43">保留與新增零件</text>
<text x="100" y="1938" font-size="18" font-weight="700" fill="#102a43">GPIO7 → K1；GPIO2 → Q2 → K2；新增 GPIO1 → SIG</text>
<text x="100" y="1976" font-size="18" font-weight="400" fill="#102a43">Q2：S9014 或原 2N3904；B/C/E 依實物辨識</text>
<text x="100" y="2014" font-size="18" font-weight="400" fill="#102a43">R1=1.5kΩ、R2=47kΩ、R3=4.7kΩ，原接法保留</text>
<text x="100" y="2052" font-size="18" font-weight="700" fill="#102a43">R4=10kΩ 新增；四顆電阻皆 ¼W／±5%</text>
<text x="100" y="2090" font-size="18" font-weight="400" fill="#102a43">K2 VCC 仍用既有 5V；F3／F4／F5 安培值待定</text>
<text x="100" y="2128" font-size="18" font-weight="700" fill="#be123c">SV1 型號／電流未確認；原 JGB37-520 數據不沿用</text>
<text x="925" y="1900" font-size="22" font-weight="700" fill="#102a43">所有感測器連續三次符合後</text>
<text x="925" y="1938" font-size="18" font-weight="400" fill="#102a43">① K1、K2 啟動；GPIO1 暫維持 LOW 約 100ms</text>
<text x="925" y="1976" font-size="18" font-weight="700" fill="#be123c">② 送 1500µs 約 500ms；定位型此時可能移動</text>
<text x="925" y="2014" font-size="18" font-weight="700" fill="#102a43">③ 固定送 1600µs，觀察停在角度或持續旋轉</text>
<text x="925" y="2052" font-size="18" font-weight="400" fill="#102a43">④ 任一感測器解除：停止脈波、K2 斷電、K1 關閉</text>
