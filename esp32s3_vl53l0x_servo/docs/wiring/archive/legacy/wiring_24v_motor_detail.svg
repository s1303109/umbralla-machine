<path d="M1250 363 L1232 397 H1268 Z" fill="white" stroke="#111827" stroke-width="3"/>
<path d="M1250 397 V510" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<circle cx="1250" cy="300" r="6" fill="#be123c"/>
<circle cx="1250" cy="510" r="6" fill="#111827"/>
<text x="1140" y="339" font-size="16" font-weight="700" fill="#102a43">D1：1N5408</text>
<text x="1280" y="348" font-size="14" font-weight="700" fill="#102a43">K 有環端</text>
<text x="1280" y="410" font-size="14" font-weight="400" fill="#102a43">A 無環端</text>
<circle cx="380" cy="510" r="6" fill="#111827"/>
<text x="435" y="568" font-size="18" font-weight="700" fill="#be123c">24V 僅供馬達；K2 的 5V 供電見 D 區</text>
<path d="M380 510 V611 H420" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<text x="435" y="619" font-size="18" font-weight="700" fill="#102a43">0V → D 區 G 共地端子排</text>
<text x="890" y="560" font-size="18" font-weight="400" fill="#102a43">D1：1N5408，3A／1000V，靠近馬達安裝。</text>
<text x="890" y="590" font-size="17" font-weight="400" fill="#102a43">條件選型：馬達最大斷電電流 ≤2A，低頻啟停。</text>
<text x="890" y="620" font-size="17" font-weight="400" fill="#102a43">馬達負極直接回 PS2；不要經過 ESP32 的 GND 細線。</text>
<text x="75" y="655" font-size="18" font-weight="700" fill="#be123c">K2：JQC3F-05VDC-C／HW-307，VCC 供 5V；賣場圖示 DC30V/10A，實物與馬達負載能力仍須核對。</text>
<rect x="40" y="710" width="1720" height="680" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="65" y="750" font-size="26" font-weight="700" fill="#102a43">D. 新增 5V 繼電器供電與訊號介面（HW-307／JQC3F-05VDC-C）</text>
<text x="65" y="785" font-size="19" font-weight="400" fill="#102a43">原 K1：GPIO7／H 觸發；新 K2：GPIO2 經 Q2 拉低 IN 啟動。供電 5V，馬達用 24V；不需 12V 降壓器。</text>
<text x="85" y="851" font-size="18" font-weight="700" fill="#be123c">來自 B 區 +5V BUS</text>
<rect x="90" y="883" width="130" height="34" rx="3" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="104" y="907" font-size="18" font-weight="700" fill="#102a43">F4：待定</text>
<path d="M75 900 H90" fill="none" stroke="#c27100" stroke-width="4" stroke-linejoin="round"/>
<path d="M220 900 H350" fill="none" stroke="#c27100" stroke-width="4" stroke-linejoin="round"/>
<rect x="350" y="820" width="350" height="240" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="375" y="858" font-size="21" font-weight="700" fill="#102a43">既有 5V 電源分配</text>
<text x="375" y="907" font-size="18" font-weight="700" fill="#102a43">+5V</text>
<text x="615" y="907" font-size="18" font-weight="700" fill="#102a43">+5V</text>
<text x="375" y="956" font-size="18" font-weight="400" fill="#be123c">接 K2 前先量測為 5.0V</text>
<text x="375" y="1007" font-size="18" font-weight="700" fill="#102a43">0V</text>
<text x="615" y="1007" font-size="18" font-weight="700" fill="#102a43">0V</text>
<text x="375" y="1042" font-size="16" font-weight="400" fill="#102a43">由既有 5V 母線分支；可用電流待核對</text>
<path d="M700 900 H1320" fill="none" stroke="#c27100" stroke-width="5" stroke-linejoin="round"/>
<text x="770" y="879" font-size="18" font-weight="700" fill="#c27100">+5V → K2 VCC 與 R3；不接 24V</text>
<path d="M350 1000 H270 V1320" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
<path d="M700 1000 H730" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<text x="738" y="1007" font-size="16" font-weight="400" fill="#102a43">G（接共地排）</text>
<rect x="1320" y="820" width="390" height="280" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="1345" y="858" font-size="21" font-weight="700" fill="#102a43">K2 模組控制側：5V 供電</text>
<text x="1345" y="907" font-size="19" font-weight="700" fill="#102a43">VCC ← +5V（經 F4）</text>
<text x="1345" y="946" font-size="20" font-weight="700" fill="#be123c">低電位觸發；無可見 H/L 跳帽</text>
<text x="1345" y="1007" font-size="19" font-weight="700" fill="#102a43">IN ← Q2 集電極 C</text>
<text x="1345" y="1067" font-size="19" font-weight="700" fill="#102a43">GND ← G（0V）</text>
<path d="M1320 1060 H1290 V1320" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
<rect x="75" y="1100" width="325" height="170" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="100" y="1138" font-size="22" font-weight="700" fill="#102a43">ESP32：新增 GPIO2</text>
<text x="100" y="1173" font-size="18" font-weight="400" fill="#102a43">HIGH 啟動／LOW 關閉</text>
<text x="100" y="1208" font-size="18" font-weight="400" fill="#102a43">LCD 與感測器線全部保留</text>
<text x="100" y="1243" font-size="18" font-weight="400" fill="#102a43">GND → G 共地端子排</text>
<path d="M400 1160 H600" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
<text x="85" y="962" font-size="17" font-weight="700" fill="#7c3aed">原 GPIO7 → K1 IN</text>
<text x="85" y="991" font-size="17" font-weight="400" fill="#7c3aed">保持原 H 觸發接線</text>
<rect x="600" y="1145" width="120" height="30" rx="2" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
<text x="592" y="1126" font-size="18" font-weight="700" fill="#102a43">R1：1.5kΩ</text>
<text x="592" y="1102" font-size="16" font-weight="400" fill="#102a43">0.25W／±5%</text>
<path d="M720 1160 H955" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linejoin="round"/>
<circle cx="820" cy="1160" r="6" fill="#7c3aed"/>
