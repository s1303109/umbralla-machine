<path d="M993 1194 L1010 1216 L984 1209 Z" fill="#111827"/>
<text x="916" y="1141" font-size="18" font-weight="700" fill="#102a43">B</text>
<text x="1035" y="1090" font-size="18" font-weight="700" fill="#102a43">C</text>
<text x="1035" y="1250" font-size="18" font-weight="700" fill="#102a43">E</text>
<text x="1050" y="1276" font-size="17" font-weight="700" fill="#102a43">Q2：2N3904（NPN）</text>
<circle cx="1160" cy="900" r="6" fill="#c27100"/>
<path d="M1160 900 V930" fill="none" stroke="#c27100" stroke-width="3" stroke-linejoin="round"/>
<rect x="1149" y="930" width="22" height="40" rx="2" fill="#fff" stroke="#486581" stroke-width="2"/>
<path d="M1160 970 V1000" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<circle cx="1160" cy="1000" r="6" fill="#111827"/>
<circle cx="1015" cy="1000" r="6" fill="#111827"/>
<text x="1183" y="957" font-size="17" font-weight="400" fill="#102a43">R3：4.7kΩ</text>
<text x="1183" y="983" font-size="15" font-weight="400" fill="#102a43">¼W ±5%</text>
<path d="M400 1250 H430 V1320" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
<path d="M75 1320 H1550" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
<circle cx="270" cy="1320" r="6" fill="#111827"/>
<circle cx="430" cy="1320" r="6" fill="#111827"/>
<circle cx="820" cy="1320" r="6" fill="#111827"/>
<circle cx="1015" cy="1320" r="6" fill="#111827"/>
<circle cx="1290" cy="1320" r="6" fill="#111827"/>
<text x="85" y="1347" font-size="17" font-weight="700" fill="#102a43">G：24V 負極、5V 負極、ESP32 GND、Q2 E、K2 GND 接同一低壓共地排</text>
<text x="85" y="1377" font-size="18" font-weight="700" fill="#102a43">共同判斷：GPIO7 → K1；GPIO2 → Q2 → K2。啟動時兩路 HIGH，停止時兩路 LOW（須先驗證）。</text>
<text x="60" y="1424" font-size="19" font-weight="400" fill="#be123c">介面驗證：IN ≤0.2V 吸合、IN ≥4.5V 釋放；Q2 集電極總電流 ≤10mA，超過需重算介面。</text>
<text x="60" y="1458" font-size="18" font-weight="400" fill="#102a43">同名端點視為相接；交叉處有圓點才相接。保險絲、線徑、D1 與 K2 馬達負載能力尚待核對，這不是已驗收施工圖。</text>
<rect x="40" y="1495" width="1720" height="460" rx="12" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="65" y="1535" font-size="26" font-weight="700" fill="#102a43">E. 零件型號、採購數值與腳位（本次計算選型，非已完成實測）</text>
<rect x="75" y="1565" width="800" height="335" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<rect x="900" y="1565" width="820" height="335" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="100" y="1600" font-size="22" font-weight="700" fill="#102a43">控制側零件</text>
<text x="100" y="1635" font-size="19" font-weight="400" fill="#102a43">Q2 ×1：onsemi 2N3904，NPN，TO-92；設計 IC ≤10mA</text>
<text x="100" y="1668" font-size="19" font-weight="400" fill="#102a43">Q2 腳位：1=E、2=B、3=C（依該廠 TO-92 封裝圖）</text>
<text x="100" y="1701" font-size="19" font-weight="700" fill="#102a43">R1 ×1：1.5kΩ／0.25W／±5%（GPIO2 → B）</text>
<text x="100" y="1734" font-size="19" font-weight="400" fill="#102a43">R2 ×1：47kΩ／0.25W／±5%（B → E/G）</text>
<text x="100" y="1767" font-size="19" font-weight="400" fill="#102a43">R3 ×1：4.7kΩ／0.25W／±5%（+5V → IN/C）</text>
<text x="100" y="1800" font-size="19" font-weight="400" fill="#102a43">K2 ×1：HW-307／JQC3F-05VDC-C（以實物為準）</text>
<text x="100" y="1833" font-size="19" font-weight="700" fill="#102a43">K2：DC5V 供電、低電位觸發；IN 電流待測</text>
<text x="100" y="1866" font-size="18" font-weight="400" fill="#102a43">電晶體只處理 IN 訊號；馬達電流經 K2 COM/NO。</text>
<text x="925" y="1600" font-size="22" font-weight="700" fill="#102a43">馬達側及供電零件</text>
<text x="925" y="1635" font-size="19" font-weight="700" fill="#102a43">D1 ×1：Vishay 1N5408-E3/54，DO-201AD</text>
<text x="925" y="1668" font-size="19" font-weight="400" fill="#102a43">額定：3A／1000V；有環 K 接馬達＋，A 接馬達－</text>
<text x="925" y="1701" font-size="18" font-weight="700" fill="#be123c">前提：最大斷電電流 ≤2A；仍須核對續流時間與溫升。</text>
<text x="925" y="1734" font-size="19" font-weight="400" fill="#102a43">5V → F4 → K2 VCC；本版不使用降壓模組</text>
<text x="925" y="1767" font-size="18" font-weight="400" fill="#102a43">5V 預留 ≥0.2A 供 K2（設計預留值，耗電待測）</text>
<text x="925" y="1800" font-size="19" font-weight="400" fill="#102a43">F3、F4：DC 額定 ≥32V，安培值待電源／馬達確認</text>
<text x="925" y="1833" font-size="18" font-weight="400" fill="#102a43">PS2：DC24V，電流未知；M2：JGB37-520／24V／200rpm</text>
<text x="925" y="1866" font-size="17" font-weight="400" fill="#102a43">元件為設計選型；模組板上零件及端子額定須一併核對。</text>
<text x="75" y="1930" font-size="19" font-weight="700" fill="#102a43">計算：R3 標稱電流 ≈1.06mA；Q2 設計 IC ≤10mA、IB(min)≈1.12mA；D1 的 2A 前提非實測值。</text></svg>