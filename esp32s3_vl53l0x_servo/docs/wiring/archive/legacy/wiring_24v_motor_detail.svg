<text x="775" y="258" font-size="21" font-weight="700" fill="#102a43">K2：新小繼電器接點側</text>
<text x="775" y="325" font-size="19" font-weight="700" fill="#102a43">COM</text>
<text x="1045" y="325" font-size="19" font-weight="700" fill="#102a43">NO</text>
<path d="M750 300 H860" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<path d="M860 300 L970 275" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<circle cx="990" cy="300" r="6" fill="white" stroke="#111827" stroke-width="2"/>
<path d="M996 300 H1120" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<text x="775" y="370" font-size="18" font-weight="400" fill="#102a43">NC 留空；接點只切換 24V</text>
<text x="775" y="402" font-size="18" font-weight="400" fill="#be123c">不能接到原 K1 的 110V 端子</text>
<text x="775" y="434" font-size="17" font-weight="400" fill="#102a43">馬達負載適用性：待規格／測試</text>
<path d="M1120 300 H1380" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<rect x="1380" y="220" width="320" height="250" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="1405" y="258" font-size="21" font-weight="700" fill="#102a43">M2：24V 直流減速馬達</text>
<text x="1405" y="307" font-size="20" font-weight="700" fill="#102a43">＋  馬達正極</text>
<text x="1405" y="352" font-size="18" font-weight="400" fill="#102a43">JGB37-520／24V／200 rpm</text>
<text x="1405" y="386" font-size="18" font-weight="400" fill="#102a43">兩線式、單方向啟停</text>
<text x="1405" y="427" font-size="20" font-weight="700" fill="#102a43">－  馬達負極</text>
<path d="M335 420 H380 V510 H1350 V420 H1380" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
<path d="M1250 300 V355" fill="none" stroke="#be123c" stroke-width="4" stroke-linejoin="round"/>
