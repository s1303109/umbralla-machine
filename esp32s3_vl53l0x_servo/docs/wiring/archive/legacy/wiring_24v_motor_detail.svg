<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2000" viewBox="0 0 1800 2000"><title>新增24V減速馬達接線詳圖</title><desc>保留既有系統，使用5V低電位觸發繼電器與NPN介面，GPIO2控制24V馬達，GPIO7保留控制原鼓風機；使用既有5V輸出，無12V降壓器。待電源、馬達與模組實測確認。</desc><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="1800" height="2000" fill="#f8fafc"/><text x="60" y="48" font-size="30" font-weight="700" fill="#102a43">新增 24V 減速馬達｜保留原系統、兩路使用相同感測器條件</text>
<text x="60" y="82" font-size="19" font-weight="400" fill="#be123c">設計待核對：電源電流未知、24V 馬達尚待實物確認；新增元件與低電位介面尚未實測。</text>
<rect x="40" y="110" width="1720" height="570" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="65" y="150" font-size="26" font-weight="700" fill="#102a43">C. 新增 24V 馬達電力區（K2 與原 K1 的接點完全分開）</text>
<text x="65" y="184" font-size="18" font-weight="400" fill="#102a43">M2 須為 24V 版本；僅畫新增直流輸出，電源本體／輸入與額定電流待實物銘牌核對。</text>
<rect x="75" y="220" width="260" height="250" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="100" y="258" font-size="21" font-weight="700" fill="#102a43">PS2：既有 24V 輸出</text>
<text x="100" y="307" font-size="22" font-weight="700" fill="#102a43">+24V 輸出</text>
<text x="100" y="350" font-size="18" font-weight="400" fill="#be123c">額定輸出幾 A：未知</text>
<text x="100" y="380" font-size="18" font-weight="400" fill="#102a43">需核對馬達啟動能力</text>
<text x="100" y="427" font-size="22" font-weight="700" fill="#102a43">0V／負極</text>
<rect x="440" y="280" width="180" height="40" rx="4" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="452" y="307" font-size="18" font-weight="700" fill="#102a43">F3：安培值待定</text>
<text x="430" y="265" font-size="18" font-weight="400" fill="#102a43">馬達支路保險絲</text>
<text x="430" y="352" font-size="16" font-weight="400" fill="#102a43">DC 額定 ≥32V；依線徑與啟動電流選</text>
