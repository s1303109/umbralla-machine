<text x="1460" y="307" font-size="20" font-weight="700" fill="#102a43">＋  馬達正極</text>
<text x="1460" y="352" font-size="20" font-weight="700" fill="#102a43">JGB37-520／6V</text>
<text x="1460" y="386" font-size="18" font-weight="400" fill="#102a43">兩線式、單方向啟停</text>
<text x="1460" y="427" font-size="20" font-weight="700" fill="#102a43">－  馬達負極</text>
<path d="M305 420 H350 V510 H1400 V420 H1440" fill="none" stroke="#111827" stroke-width="5" stroke-linejoin="round"/>
<path d="M510 420 H480 V510" fill="none" stroke="#111827" stroke-width="4" stroke-linejoin="round"/>
