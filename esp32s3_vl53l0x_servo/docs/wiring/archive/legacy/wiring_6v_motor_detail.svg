<text x="1070" y="332" font-size="19" font-weight="700" fill="#102a43">COM</text>
<text x="1230" y="332" font-size="19" font-weight="700" fill="#102a43">NO</text>
<path d="M1050 300 H1120" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<path d="M1120 300 L1200 275" fill="none" stroke="#111827" stroke-width="3" stroke-linejoin="round"/>
<circle cx="1220" cy="300" r="6" fill="white" stroke="#111827" stroke-width="2"/>
