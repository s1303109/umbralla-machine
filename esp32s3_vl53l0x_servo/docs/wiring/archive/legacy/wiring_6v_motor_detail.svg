<text x="1070" y="370" font-size="17" font-weight="400" fill="#102a43">NC 留空；只切換 6V</text>
<text x="1070" y="402" font-size="17" font-weight="700" fill="#be123c">不接原 K1 的 110V</text>
<text x="1070" y="434" font-size="17" font-weight="400" fill="#102a43">馬達負載能力待核對</text>
<path d="M1300 300 H1440" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<rect x="1440" y="220" width="290" height="250" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
