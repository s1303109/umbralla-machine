<text x="879" y="265" font-size="16" font-weight="400" fill="#102a43">6V 輸出保護</text>
<text x="894" y="352" font-size="16" font-weight="400" fill="#102a43">DC ≥32V</text>
<path d="M1000 300 H1050" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<rect x="1050" y="220" width="250" height="250" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
