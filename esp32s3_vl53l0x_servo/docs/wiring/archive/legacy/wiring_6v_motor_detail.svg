<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2000" viewBox="0 0 1800 2000"><title>LM2596 24V轉6V減速馬達接線詳圖</title><desc>既有24V經LM2596降至6V，由K2 COM及NO切換6V馬達。K2仍以既有5V供電，GPIO2經NPN控制IN，GPIO7與原系統保留。馬達電流未知，模組啟動容量及D1熱條件待確認。</desc><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="1800" height="2000" fill="#f8fafc"/><text x="60" y="48" font-size="30" font-weight="700" fill="#102a43">6V 減速馬達｜24V → LM2596 → 6V；保留原系統與感測器條件</text>
<text x="60" y="82" font-size="19" font-weight="400" fill="#be123c">馬達額定／啟動／堵轉電流未知：降壓模組容量、D1 熱條件及保險絲安培值尚待確認。</text>
<rect x="40" y="110" width="1720" height="570" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
<text x="65" y="150" font-size="26" font-weight="700" fill="#102a43">C. 馬達電力區：24V 降至 6V 後，才進 K2 COM／NO</text>
<text x="65" y="184" font-size="18" font-weight="700" fill="#be123c">U1 為可調式 LM2596 模組，非裸 IC；先不接馬達，量測 OUT+／OUT− 並調至 6.0V。</text>
<rect x="75" y="220" width="230" height="250" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="95" y="258" font-size="21" font-weight="700" fill="#102a43">PS2：既有 24V</text>
<text x="95" y="307" font-size="22" font-weight="700" fill="#102a43">+24V 輸出</text>
<text x="95" y="350" font-size="18" font-weight="400" fill="#be123c">額定電流未知</text>
<text x="95" y="383" font-size="18" font-weight="400" fill="#102a43">原 5V 輸出保留</text>
<text x="95" y="427" font-size="22" font-weight="700" fill="#102a43">0V／負極</text>
<rect x="340" y="280" width="130" height="40" rx="4" fill="#fff7ed" stroke="#c27100" stroke-width="2"/>
<text x="354" y="307" font-size="18" font-weight="700" fill="#102a43">F3 待定</text>
<text x="334" y="265" font-size="16" font-weight="400" fill="#102a43">24V 輸入保護</text>
<text x="332" y="352" font-size="16" font-weight="400" fill="#102a43">DC ≥32V</text>
<path d="M305 300 H340" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<path d="M470 300 H510" fill="none" stroke="#be123c" stroke-width="5" stroke-linejoin="round"/>
<rect x="510" y="220" width="340" height="250" rx="12" fill="#fff" stroke="#486581" stroke-width="2"/>
<text x="530" y="258" font-size="21" font-weight="700" fill="#102a43">U1：LM2596 可調模組</text>
<text x="530" y="325" font-size="19" font-weight="700" fill="#102a43">IN+</text>
<text x="765" y="325" font-size="19" font-weight="700" fill="#102a43">OUT+</text>
<text x="530" y="370" font-size="20" font-weight="700" fill="#be123c">輸入 24V → 輸出 6.0V</text>
<text x="530" y="399" font-size="17" font-weight="400" fill="#102a43">可用電流與散熱：待核對</text>
<text x="530" y="446" font-size="19" font-weight="700" fill="#102a43">IN−</text>
<text x="765" y="446" font-size="19" font-weight="700" fill="#102a43">OUT−</text>
