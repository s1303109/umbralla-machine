<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1880" viewBox="0 0 1500 1880"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#a65aaf"/></marker></defs><style>text{font-family:"Noto Sans CJK TC",sans-serif}</style><rect width="1500" height="1880" fill="#fafcfe"/><text x="60" y="58" font-size="34" font-weight="700" fill="#17324d">PCB 元件擺放建議｜依第一張零件、第二張接線功能</text><text x="60" y="99" font-size="20" font-weight="400" fill="#a64819">相對位置示意，不按比例；未取得原始 PCB、完整模組外形與固定孔，不能作製板尺寸或銅箔圖。</text><text x="60" y="148" font-size="28" font-weight="700" fill="#17324d">A. LCD 與 ESP32 維持同面：先把 ESP32 橫放在 LCD 下方</text><rect x="80" y="195" width="1000" height="1120" rx="10" fill="#f0f8f4" stroke="#3d8b6f" stroke-width="2" stroke-dasharray="10 7"/><text x="105" y="229" font-size="21" font-weight="700" fill="#17324d">載板區域示意（外形最後再定，不是正式 Edge.Cuts）</text><rect x="140" y="270" width="880" height="440" rx="10" fill="#e7edf5" stroke="#536b88" stroke-width="2"/><text x="350" y="355" font-size="32" font-weight="700" fill="#17324d">U11：3.5 吋 LCD</text><text x="320" y="407" font-size="25" font-weight="400" fill="#17324d">先固定實際位置、方向、孔位</text><text x="302" y="449" font-size="22" font-weight="400" fill="#9d5520">若線材外接，載板只需保留對應插座</text><circle cx="420" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="449" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="478" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="507" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="536" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="565" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="594" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="623" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="652" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="681" cy="291" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="420" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="449" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="478" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="507" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="536" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="565" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="594" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="623" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="652" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="681" cy="688" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><text x="170" y="659" font-size="21" font-weight="700" fill="#17324d">資料腳排朝向 ESP32；實際腳序按網表核對</text><rect x="65" y="790" width="650" height="190" rx="10" fill="#edf0ff" stroke="#7165a5" stroke-width="2"/><rect x="65" y="790" width="108" height="190" rx="10" fill="#f4ddf9" stroke="#a65aaf" stroke-width="2" stroke-dasharray="10 7"/><text x="80" y="835" font-size="24" font-weight="700" fill="#8e3d96">天線</text><text x="80" y="872" font-size="20" font-weight="400" fill="#8e3d96">朝板外</text><path d="M80 922 H22" fill="none" stroke="#a65aaf" stroke-width="3" marker-end="url(#arrow)"/><text x="250" y="865" font-size="27" font-weight="700" fill="#17324d">U5：ESP32-S3 橫放</text><text x="205" y="909" font-size="22" font-weight="700" fill="#17324d">含 GPIO13～18 的排針朝向 LCD</text><text x="205" y="947" font-size="20" font-weight="400" fill="#17324d">依飛線選轉向，不預設 R90／R270</text><circle cx="205" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="228" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="251" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="274" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="297" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="320" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="343" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="366" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="389" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="412" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="435" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="458" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="481" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="504" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="527" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="550" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="573" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="596" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="619" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="642" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="665" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="688" cy="808" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="205" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="228" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="251" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="274" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="297" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="320" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="343" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="366" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="389" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="412" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="435" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="458" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="481" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="504" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="527" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="550" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="573" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="596" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="619" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="642" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="665" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><circle cx="688" cy="962" r="6" fill="#e4af38" stroke="#8a691a" stroke-width="2"/><rect x="715" y="843" width="345" height="91" rx="10" fill="#fff8df" stroke="#cb9a33" stroke-width="2" stroke-dasharray="10 7"/><text x="735" y="880" font-size="22" font-weight="700" fill="#17324d">USB 插頭／拔插通道</text><text x="735" y="914" font-size="19" font-weight="400" fill="#17324d">此區不擺接頭或高零件</text><path d="M455 710 L420 790" fill="none" stroke="#2584c5" stroke-width="2" stroke-dasharray="8 6"/><path d="M482 710 L447 790" fill="none" stroke="#2584c5" stroke-width="2" stroke-dasharray="8 6"/><path d="M509 710 L474 790" fill="none" stroke="#2584c5" stroke-width="2" stroke-dasharray="8 6"/><path d="M536 710 L501 790" fill="none" stroke="#2584c5" stroke-width="2" stroke-dasharray="8 6"/><path d="M563 710 L528 790" fill="none" stroke="#2584c5" stroke-width="2" stroke-dasharray="8 6"/><text x="410" y="755" font-size="20" font-weight="700" fill="#17324d">優先布 LCD 資料與控制線</text><rect x="130" y="1035" width="175" height="80" rx="10" fill="#e6f8ff" stroke="#3096ae" stroke-width="2"/><text x="145" y="1066" font-size="20" font-weight="700" fill="#17324d">HC-SR04 接頭</text><text x="145" y="1098" font-size="18" font-weight="400" fill="#17324d">靠 GPIO5／6 側</text><rect x="330" y="1028" width="205" height="90" rx="10" fill="#fff2de" stroke="#c18c35" stroke-width="2"/><text x="345" y="1063" font-size="20" font-weight="700" fill="#17324d">R4 10k／R5 20k</text><text x="345" y="1096" font-size="18" font-weight="400" fill="#17324d">靠 GPIO6 分壓中點</text><rect x="580" y="1020" width="180" height="115" rx="10" fill="#fff2de" stroke="#c18c35" stroke-width="2"/><text x="595" y="1053" font-size="20" font-weight="700" fill="#17324d">Q2＋R1／R2</text><text x="595" y="1083" font-size="19" font-weight="400" fill="#17324d">R3 靠 IN／C</text><text x="595" y="1113" font-size="18" font-weight="400" fill="#17324d">靠 GPIO2 側</text><rect x="800" y="1010" width="240" height="100" rx="10" fill="#ffecdf" stroke="#c97736" stroke-width="2"/><text x="815" y="1044" font-size="21" font-weight="700" fill="#17324d">U4／K2 馬達支路</text><text x="815" y="1077" font-size="18" font-weight="400" fill="#17324d">接點朝電源／馬達端</text><rect x="130" y="1185" width="175" height="80" rx="10" fill="#e6f8ff" stroke="#3096ae" stroke-width="2"/><text x="145" y="1217" font-size="20" font-weight="700" fill="#17324d">K1 控制接口</text><text x="145" y="1246" font-size="18" font-weight="400" fill="#17324d">5V／GND／IN7</text><rect x="330" y="1185" width="180" height="80" rx="10" fill="#e6f8ff" stroke="#3096ae" stroke-width="2"/><text x="345" y="1218" font-size="21" font-weight="700" fill="#17324d">ToF1 接頭</text><text x="345" y="1247" font-size="17" font-weight="400" fill="#17324d">靠 GPIO8／9／10</text><rect x="535" y="1185" width="185" height="80" rx="10" fill="#e6f8ff" stroke="#3096ae" stroke-width="2"/><text x="550" y="1218" font-size="21" font-weight="700" fill="#17324d">ToF2 接頭</text><text x="550" y="1247" font-size="18" font-weight="400" fill="#17324d">靠 GPIO11／12</text><rect x="850" y="1140" width="190" height="57" rx="10" fill="#ffe4df" stroke="#be573e" stroke-width="2"/><text x="865" y="1176" font-size="21" font-weight="700" fill="#17324d">DC 電源入口</text><rect x="850" y="1220" width="190" height="57" rx="10" fill="#ffe4df" stroke="#be573e" stroke-width="2"/><text x="865" y="1256" font-size="21" font-weight="700" fill="#17324d">U7 馬達接口</text><rect x="755" y="1217" width="78" height="64" rx="10" fill="#fff2de" stroke="#c18c35" stroke-width="2"/><text x="767" y="1256" font-size="23" font-weight="700" fill="#17324d">D1</text><path d="M945 1197 V1220" fill="none" stroke="#be573e" stroke-width="3" stroke-dasharray="8 6"/><text x="1115" y="227" font-size="25" font-weight="700" fill="#17324d">擺放時保留的限制</text><rect x="1110" y="250" width="340" height="1065" rx="10" fill="#fff" stroke="#b8c5d2" stroke-width="2"/><text x="1130" y="298" font-size="21" font-weight="700" fill="#17324d">LCD 大外框不能任意縮小</text><text x="1130" y="335" font-size="18" font-weight="400" fill="#17324d">直插才需要預留整塊模組；</text><text x="1130" y="367" font-size="18" font-weight="400" fill="#17324d">外接時改用已確認的接頭。</text><text x="1130" y="463" font-size="21" font-weight="700" fill="#17324d">ESP32 天線及 USB 要留空</text><text x="1130" y="500" font-size="18" font-weight="400" fill="#17324d">天線避開 LCD 金屬背板；</text><text x="1130" y="532" font-size="18" font-weight="400" fill="#17324d">USB 線要能插入與拔出。</text><text x="1130" y="628" font-size="21" font-weight="700" fill="#17324d">電阻按功能分組</text><text x="1130" y="665" font-size="18" font-weight="400" fill="#17324d">R1／R2 靠 Q2；R3 靠 IN。</text><text x="1130" y="697" font-size="18" font-weight="400" fill="#17324d">R4／R5 靠 GPIO6。</text><text x="1130" y="793" font-size="21" font-weight="700" fill="#17324d">馬達支路靠板邊</text><text x="1130" y="830" font-size="18" font-weight="400" fill="#17324d">電源、K2、D1、輸出靠近；</text><text x="1130" y="862" font-size="18" font-weight="400" fill="#17324d">回流直接回電源入口。</text><text x="1130" y="958" font-size="21" font-weight="700" fill="#17324d">U1／U2 的市電側另置</text><text x="1130" y="995" font-size="18" font-weight="400" fill="#17324d">此圖載板只放 DC 與控制口；</text><text x="1130" y="1027" font-size="18" font-weight="400" fill="#17324d">AC 接線功能仍依第二張圖。</text><text x="1130" y="1123" font-size="21" font-weight="700" fill="#17324d">虛線不代表實際銅箔</text><text x="1130" y="1160" font-size="18" font-weight="400" fill="#17324d">沒有指定焊盤座標或走線；</text><text x="1130" y="1192" font-size="18" font-weight="400" fill="#17324d">不能由這張圖產生 Gerber。</text><text x="85" y="1362" font-size="19" font-weight="400" fill="#a64819">實際封裝若為整塊繼電器模組，須以模組本體外形取代小接頭圖框；同面零件不可因只看焊盤而互相重疊。</text><text x="60" y="1430" font-size="28" font-weight="700" fill="#17324d">B. 機構允許時更省面積：LCD 在正面，ESP32 與小零件在背面</text><rect x="80" y="1460" width="1370" height="285" rx="10" fill="#f7f5fe" stroke="#8b78ac" stroke-width="2"/><rect x="140" y="1512" width="620" height="65" rx="10" fill="#e7edf5" stroke="#536b88" stroke-width="2"/><text x="312" y="1555" font-size="25" font-weight="700" fill="#17324d">LCD／金屬背板</text><path d="M205 1577 V1620 M690 1577 V1620" fill="none" stroke="#54758c" stroke-width="8"/><rect x="160" y="1620" width="580" height="36" rx="3" fill="#edf0ff" stroke="#7165a5" stroke-width="2"/><text x="240" y="1696" font-size="21" font-weight="700" fill="#17324d">背面 ESP32／載板；高度與孔位必須核對</text><text x="820" y="1518" font-size="22" font-weight="700" fill="#17324d">這是省平面面積的候選方案，</text><text x="820" y="1561" font-size="21" font-weight="400" fill="#17324d">不是把兩個同面封裝直接重疊。</text><text x="820" y="1604" font-size="20" font-weight="400" fill="#17324d">天線須避開 LCD 金屬投影與 RF 淨空區；</text><text x="820" y="1647" font-size="20" font-weight="400" fill="#17324d">需保留插座高度、螺絲、絕緣與 USB 空間。</text><text x="60" y="1800" font-size="21" font-weight="700" fill="#17324d">布線保持第二張圖與程式的 GPIO 對應；先修正原理圖／網表，再做 ERC、佈局、DRC。</text><text x="60" y="1840" font-size="20" font-weight="400" fill="#276c53">若 LCD、繼電器及感測器均線材外接，最省面積的載板只需 ESP32 插座、小零件與板邊接頭。</text></svg>